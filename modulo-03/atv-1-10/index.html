<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap 5 - Tamanhos</title>
</head>

<body class="background justify-content-center align-items-center d-flex min-vh-100 min-vw-100">
    <div class="background-circle background-circle-top-left" aria-hidden="true"></div>
    <div class="background-circle background-circle-bottom-right" aria-hidden="true"></div>

    <main class="container ">
        <div class="row row-cols-2  justify-content align-items-center">
            <div class="col mt-2">
                <div class="p-5  text-white font-weight-bold fs-2">
                    Welcome to the jungle<br>
                    <b>We are CK</b>

                </div>
            </div>


            <div class="row row-cols-1  g-3 ">
                <div class="col">
                    <div class="p-3 card text-white d-flex flex-row align-items-center gap-3">
                        <i class="bi bi-filetype-html fs-4 icon-html" aria-hidden="true"></i>
                        <span>HTML</span>
                    </div>
                </div>
                <div class="col">
                    <div class="p-3 card text-white d-flex flex-row align-items-center gap-3">
                        <i class="bi bi-filetype-css fs-4 icon-css" aria-hidden="true"></i>
                        <span>CSS</span>
                    </div>
                </div>
                <div class="col">
                    <div class="p-3 card text-white d-flex flex-row align-items-center gap-3">
                        <i class="bi bi-filetype-js fs-4 icon-js" aria-hidden="true"></i>
                        <span>JavaScript</span>
                    </div>
                </div>
                <div class="col">
                    <div class="p-3 card text-white d-flex flex-row align-items-center gap-3">
                        <i class="bi bi-universal-access fs-4 icon-accessibility" aria-hidden="true"></i>
                        <span>Acessibility</span>
                    </div>
                </div>

            </div>
        </div>


    </main>
</body>

</html>
